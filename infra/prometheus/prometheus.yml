# Prometheus scrape configuration for Hades.
# The API serves metrics on its HTTP port; the background services each expose a
# metrics endpoint on METRICS_PORT (9100) via the platform's metrics server.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: hades-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: api

  - job_name: hades-services
    metrics_path: /metrics
    static_configs:
      - targets: ["engine:9100"]
        labels: {service: engine}
      - targets: ["worker:9100"]
        labels: {service: worker}
      - targets: ["scheduler:9100"]
        labels: {service: scheduler}
      - targets: ["notification:9100"]
        labels: {service: notification}
      - targets: ["watchdog:9100"]
        labels: {service: watchdog}
